# The game, served.
#
#   docker compose up -d --build
#   open http://localhost:8083
#
# 8083 because the neighbours got there first: 8080 and 8081 are Nertz,
# production and development, 8082 is exterkamp.codes, 8085 is the chiptune
# studio and 8099 is the filling demo. Override with SOLITAIRE_PORT if this
# one is taken too.
services:
  solitaire-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SOLITAIRE_PORT:-8083}:80"
    healthcheck:
      # The index page is the whole application, so if it answers, the game is
      # up. There is nothing else to check - no database to reach, no server
      # to be healthy on the game's behalf.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

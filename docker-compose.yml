# The game, served.
#
#   docker compose up -d --build
#   open http://localhost:8083
#
# 8083 because the neighbours got there first: 8080 and 8081 are Nertz,
# production and development, 8082 is exterkamp.codes, 8085 is the chiptune
# studio and 8099 is the filling demo. Override with SOLITAIRE_PORT if this
# one is taken too.
services:
  solitaire-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SOLITAIRE_PORT:-8083}:80"
    # Two networks, for two ways in.
    #
    # `default` is this stack's own, and the published port above is the one
    # to play on while sitting next to the machine. `proxyhosts` is Traefik's,
    # shared and created outside this stack, and is how the game is reached
    # from the internet: Traefik resolves `solitaire-web` on it by name and
    # terminates TLS with the wildcard certificate, and the name arrives
    # through a Cloudflare tunnel. See dynamic/routers.yml in ~/code/traefik.
    #
    # Nothing on proxyhosts needs a published port - Nertz's public container
    # has none - but this one keeps 8083 anyway, because a solitaire game that
    # can only be reached through the internet is a silly thing to have on
    # your own laptop.
    networks:
      - default
      - proxyhosts
    healthcheck:
      # The index page is the whole application, so if it answers, the game is
      # up. There is nothing else to check - no database to reach, no server
      # to be healthy on the game's behalf.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
  # Traefik's shared network. Created outside this stack, by whoever brought
  # Traefik up - which is why `external` is not optional here: if compose were
  # allowed to create it, a `docker compose down` could take the whole
  # household's routing with it.
  proxyhosts:
    external: true
    name: proxyhosts

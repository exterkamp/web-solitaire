server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # There is no server to proxy to. That is not an omission - the game has no
  # account, no lobby and no scoreboard to post to, so this container serves
  # files and nothing else. Everything below is about caching them correctly
  # and about the one route rule an Angular app needs.

  # How long anything may be kept, which comes down to one question: is the
  # name of this file going to change when its contents do?
  #
  # For the bundle, yes - the build puts a content hash in it, so main-A1B2.js
  # can be kept for ever because a new build is a new URL. For everything
  # else, no: the card art, the fonts and the icons are copied out of public/
  # under the names they already have, and /cards/suits/diamond.svg means
  # something different after the art changes.

  # Content-hashed by the build. A new build is a new URL, so this never
  # needs checking again.
  location ~* "^/(main|styles|polyfills|chunk)-[A-Z0-9]+\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything shipped under its own name. A day is long enough that a session
  # costs one request per file and short enough that new art is on screen the
  # next day without anybody being told to clear anything. No immutable: a bad
  # copy of an unhashed file - a truncated response, a captive portal's login
  # page - would otherwise be kept for the full year with no way for a player
  # to clear it short of knowing what a hard refresh is. The ETag is what
  # makes revalidating cheap, and being able to revalidate at all is the
  # point.
  location ~* \.(js|css|svg|png|webp|woff2?|ico|txt|md)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # The document that names which bundle to run.
  #
  # Kept out of the rule above deliberately. With no Cache-Control at all a
  # browser is free to guess how long index.html stays fresh - the usual guess
  # is a tenth of its age - and a guess here means a returning player running
  # last week's index.html, asking for a bundle hash that was replaced on the
  # next deploy, and getting a 404 for the only script on the page. no-cache
  # is not "do not store": it stores it and revalidates, so the common answer
  # is a 304 and the player pays nothing for being up to date.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Anything else that looks like a file: served if it is there, 404 if it is
  # not.
  #
  # The point of it is the 404. A missing .webp would otherwise fall through
  # to the app and come back as index.html with a 200, so the loader
  # "succeeds" and builds a texture out of HTML - which then fails somewhere a
  # long way from the asset that never arrived. An Angular route has no
  # extension, so refusing extensions here costs the app nothing.
  location ~ "\.[a-zA-Z0-9]+$" {
    try_files $uri =404;
  }

  # Everything else is the app: an Angular route, not a file. This is what
  # makes /settings work when it is typed in rather than navigated to.
  location / {
    try_files $uri /index.html;
  }
}

<span class="chip-select__label">{{ label() }}</span>
<div class="chip-select__options">
  @for (option of options(); track option) {
    <button
      type="button"
      class="chip"
      [class.chip--wide]="wide()"
      [class.chip--active]="value() === option"
      [disabled]="disabled()"
      (click)="picked.emit(option)"
    >{{ text(option) }}</button>
  }
</div>

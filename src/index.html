<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>solitaire</title>
  <base href="/">
  <!-- maximum-scale and user-scalable are deliberately absent: blocking
       pinch-zoom fails WCAG 1.4.4, and nothing on the board needs the page
       itself to stay fixed. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07241f">
  <meta name="description" content="Klondike solitaire. No account, no server; everything stays in this browser.">

  <!-- Shared links render with something to show: a felt-green card fan built
       from the game's own court art (see public/og-image.png). Absolute URLs
       because a scraper follows no base tag. -->
  <meta property="og:title" content="Solitaire">
  <meta property="og:description" content="Twelve solitaire games. No account, no server; everything stays in this browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://solitaire.exterkamp.codes/">
  <meta property="og:image" content="https://solitaire.exterkamp.codes/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Solitaire">
  <meta name="twitter:description" content="Twelve solitaire games. No account, no server; everything stays in this browser.">
  <meta name="twitter:image" content="https://solitaire.exterkamp.codes/og-image.png">
  <!-- The king of diamonds, cropped to his head - the same icons the deck
       came from. The .ico carries every size from 16 up, because a browser
       picks its own and the small ones want downsampling from the big
       original rather than from each other. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <!-- iOS ignores transparency and rounds the corners itself, so this one is
       square and unrounded - the system tile does the rest. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Installable, and playable with the aeroplane mode on. The manifest is
       what makes a browser offer to add this to a home screen; the service
       worker registered in app.config.ts is what makes the thing that opens
       actually work with no network behind it. See "Installing it" in
       README.md.

       The three apple- tags are the same idea for a platform that ignores
       most of the manifest. Safari reads these, and without the first one a
       home-screen launch opens in a browser tab with its chrome, which is a
       bookmark rather than an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Solitaire">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <app-root></app-root>
</body>
</html>
